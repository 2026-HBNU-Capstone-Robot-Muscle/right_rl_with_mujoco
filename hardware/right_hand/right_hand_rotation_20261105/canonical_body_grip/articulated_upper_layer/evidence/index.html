<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>윗단 회전 하중의 별도 모델 시험</title><style>body{font:16px/1.7 system-ui;max-width:1000px;margin:30px auto;padding:0 20px;color:#24313c}video,img{width:100%}.note{background:#fff1ce;padding:15px}.pair{display:flex;gap:12px}.pair img{width:48%}</style><h1>윗단 회전 하중의 별도 모델 시험</h1><p class="note">시뮬레이션 저장 상태다. 오른손의 관절 목표는 고정하고 윗단에 가정한 회전 힘을 주었다. 실제 왼손의 모양과 접촉은 없다. 오른손이 큐브 전체를90도 돌리는 성공 영상과는 별개다.</p><p>초록색 윗단 위 빨간 점은 방향을 구분하는 표시다. 실제 충돌이나 질량을 추가하지 않는다.</p><video controls preload="metadata" src="upper_layer_plus90_1x.mp4"></video><div class="pair"><img src="before.png" alt="윗단 회전 전"><img src="after.png" alt="윗단 회전 후"></div><p>이 한 조건에서는 윗단약90도, 아래 몸통의 최대 회전약0.42도, 최대 이동약0.81mm였다. 마찰 설정과 회전 힘은 실제 큐브에서 측정한 값이 아니다.</p><p><a href="manifest.json">영상 출처</a> / <a href="../validation.json">다른 마찰 가설의 결과</a> / <a href="../../offline_review.html">전체 작업 상태</a></p></html>
