<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f5f7fb"/>
<text x="65" y="79" fill="#142338" font-family="Malgun Gothic, sans-serif" font-size="44" font-weight="700">이 두 끝의 위치를 물어본 거야</text>
<text x="65" y="129" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="25" font-weight="400">옆모습 개념도  |  손가락은 왼쪽, 손목은 오른쪽</text>
<rect x="55" y="166" width="1290" height="624" fill="white" stroke="#d8e0eb" stroke-width="2"/>
<text x="105" y="235" fill="#142338" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700">손가락 쪽</text>
<polyline points="305,260 145,260" fill="none" stroke="#34455c" stroke-width="4"/>
<polygon points="145,260 159.40715363764284,253.04055145422032 159.40715363764284,266.9594485457797" fill="#34455c"/>
<text x="1125" y="235" fill="#142338" font-family="Malgun Gothic, sans-serif" font-size="29" font-weight="700">손목 쪽</text>
<polyline points="1100,260 1260,260" fill="none" stroke="#34455c" stroke-width="4"/>
<polygon points="1260,260 1245.5928463623572,266.9594485457797 1245.5928463623572,253.04055145422032" fill="#34455c"/>
<rect x="485" y="489" width="760" height="36" fill="#b9e9f3" stroke="#218ba3" stroke-width="3"/>
<rect x="485" y="525" width="760" height="165" fill="#d8ad79" stroke="#986a3a" stroke-width="3"/>
<text x="1020" y="576" fill="#4b311a" font-family="Malgun Gothic, sans-serif" font-size="31" font-weight="700">나무 받침</text>
<text x="1176" y="461" fill="#146c82" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700">유리판</text>
<polyline points="1221,471 1221,506" fill="none" stroke="#146c82" stroke-width="3"/>
<polygon points="1221,506 1214.0405514542203,491.5928463623572 1227.9594485457797,491.5928463623572" fill="#146c82"/>
<rect x="745" y="321" width="430" height="167" fill="#263446" stroke="#142338" stroke-width="3"/>
<text x="855" y="394" fill="white" font-family="Malgun Gothic, sans-serif" font-size="37" font-weight="700">LEAP 본체</text>
<text x="877" y="435" fill="#d9e2ed" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400">손바닥 부분</text>
<rect x="615" y="344" width="129" height="84" fill="#6d7e91" stroke="#34455c" stroke-width="3"/>
<rect x="405" y="352" width="205" height="59" fill="#7f91a5" stroke="#34455c" stroke-width="3"/>
<rect x="220" y="363" width="180" height="42" fill="#a4b3c3" stroke="#34455c" stroke-width="3"/>
<text x="228" y="316" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="400">손가락과 움직이는 모터</text>
<circle cx="745" cy="488" r="25" fill="#d64045" stroke="white" stroke-width="3"/>
<text x="731" y="497" fill="white" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700">A</text>
<circle cx="485" cy="488" r="25" fill="#7356bf" stroke="white" stroke-width="3"/>
<text x="471" y="497" fill="white" font-family="Malgun Gothic, sans-serif" font-size="32" font-weight="700">B</text>
<polyline points="745,515 745,748" fill="none" stroke="#d64045" stroke-width="3" stroke-dasharray="9 9"/>
<polyline points="485,515 485,748" fill="none" stroke="#7356bf" stroke-width="3" stroke-dasharray="9 9"/>
<polyline points="493,729 737,729" fill="none" stroke="#142338" stroke-width="4"/>
<polygon points="737,729 722.5928463623571,735.9594485457797 722.5928463623571,722.0405514542203" fill="#142338"/>
<polygon points="493,729 507.4071536376428,722.0405514542203 507.4071536376428,735.9594485457797" fill="#142338"/>
<text x="515" y="713" fill="#142338" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700">이 가로 거리</text>
<text x="500" y="771" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400">예전 답변: 약 34mm</text>
<text x="805" y="293" fill="#bd3039" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="700">A  본체의 손가락 쪽 끝</text>
<polyline points="800,304 768,304 748,457" fill="none" stroke="#d64045" stroke-width="4"/>
<text x="95" y="581" fill="#6849b3" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700">B  유리와 나무의 앞끝</text>
<polyline points="445,563 484,520" fill="none" stroke="#7356bf" stroke-width="4"/>
<polygon points="484,520 479.47605497432926,535.347114432515 469.1660629560133,525.9961914391586" fill="#7356bf"/>
<text x="95" y="629" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400">초록 매트의 끝 말고,</text>
<text x="95" y="666" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="23" font-weight="400">단단한 받침의 끝을 봐줘.</text>
<text x="65" y="843" fill="#142338" font-family="Malgun Gothic, sans-serif" font-size="28" font-weight="700">그림처럼 B가 A보다 손가락 쪽으로 더 나와 있는지만 알려줘.</text>
<text x="65" y="879" fill="#53647a" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400">실제 비율과 현재 위치를 확정한 그림은 아니야. 정확히 34mm를 다시 잴 필요는 없어.</text>
</svg>