<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>중지 공간 확인 동작</title><style>body{font:17px/1.7 system-ui;max-width:1100px;margin:30px auto;padding:0 20px}.note{background:#fff0ce;padding:15px}video{width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}figure{margin:0}img{width:100%}figcaption{padding:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><h1>엄지를 고정하고 중지만 접었다 돌아오기</h1><p>초록=중지, 빨강=엄지, 파랑=검지, 노랑=약지.</p><p class="note">실제 로봇 영상이 아닌 기준 모델의 자유 큐브 시뮬레이션이다. 이번 동작은 중지 쪽 공간과 큐브 유지를 관찰한다. 완성된 하부 파지나 윗단 회전은 아직 확인하지 않았다. 정지 그림의 주황 원통은 윗단 회전 공간 표시다.</p><video controls preload="metadata" src="middle_probe_1x.mp4"></video><p>기존 파지 고정 → 중지만 약 3.6초 접기 → 약 5초 고정 → 중지 복귀. 영상은 원래 속도다. 전체 프로그램은 빈손 준비와 큐브 제거를 포함해 약 4분 걸린다.</p><div class="grid"><figure><img src="before.png"><figcaption>기존 파지</figcaption></figure><figure><img src="middle_folded.png"><figcaption>중지를 접고 고정</figcaption></figure><figure><img src="returned.png"><figcaption>기존 파지로 복귀</figcaption></figure></div><p><a href="../operator_guide.md">실행 순서</a> / <a href="manifest.json">출처와 재생 확인</a></p></html>
